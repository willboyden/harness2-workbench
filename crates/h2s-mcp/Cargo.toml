[package]
name = "h2s-mcp"
description = "Harness² Studio MCP server: every harness2 operation as MCP tools, over stdio or streamable HTTP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "h2studio-mcp"
path = "src/main.rs"

[dependencies]
h2s-api = { workspace = true, features = ["schema"] }
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
http.workspace = true
reqwest.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
tempfile.workspace = true
wiremock.workspace = true

[lints]
workspace = true
