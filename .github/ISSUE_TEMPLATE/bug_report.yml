name: Bug report
description: Something does not work as documented.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security problems must not be reported here** — see SECURITY.md.
        Remove tokens, keys and private paths from anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. h2workbench serve with this config: ...
        2. Start a demo run from the web UI ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Harness² Workbench version (`h2workbench version`)
    validations:
      required: true
  - type: input
    id: harness2
    attributes:
      label: harness2 commit (Settings → System)
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Web UI, REST API, MCP server, Job execution, Install/setup, Docs, Other]
  - type: dropdown
    id: isolation
    attributes:
      label: Isolation mode
      options: [host, container]
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (redacted)
      render: text
