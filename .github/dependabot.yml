# Dependency updates, held to the same 14-day cooldown as the rest of the supply chain
# (docs/SUPPLY-CHAIN.md). Security updates are not delayed by the cooldown.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10
    groups:
      leptos:
        patterns: ["leptos*", "reactive_graph", "tachys", "server_fn*"]
      opentelemetry:
        patterns: ["opentelemetry*", "tracing-opentelemetry"]
      wasm-bindgen:
        patterns: ["wasm-bindgen*", "js-sys", "web-sys"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directories: ["/deploy/docker"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    ignore:
      # Node majors are picked by hand from the LTS lines (even numbers). With the cooldown
      # alone, the first run skipped 26 (its tags were rebuilt within 14 days) and offered 25,
      # an odd line past its end of life. New digests of the pinned line still arrive.
      - dependency-name: "library/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(docker)"
