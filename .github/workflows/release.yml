# Release: on a version tag, build Linux binaries (x86_64, aarch64) with the embedded web UI,
# an SBOM, checksums and SLSA build-provenance attestations, and open a DRAFT release for a
# maintainer to review and publish (docs/RELEASING.md). Never moves or deletes a tag.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: wasm-bindgen-cli@0.2.129,cargo-cyclonedx@0.5.9
      - name: Check the tag matches the workspace version
        run: |
          set -euo pipefail
          want="v$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          [ "$want" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} != workspace ${want}"; exit 1; }
      - run: cargo xtask web
      - run: cargo build --release --locked -p h2w-daemon -p h2w-mcp
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="harness2-workbench-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "pkg/${name}/bin"
          cp target/release/h2workbench target/release/h2workbench-mcp "pkg/${name}/bin/"
          cp LICENSE NOTICE README.md CHANGELOG.md SECURITY.md "pkg/${name}/"
          cp -r docs deploy "pkg/${name}/"
          tar -C pkg -czf "${name}.tar.gz" "${name}"
      - name: SBOM (CycloneDX)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --all-features --override-filename sbom
          mkdir -p sbom-out
          find crates -name 'sbom.json' -print0 | while IFS= read -r -d '' f; do
            crate=$(basename "$(dirname "$f")"); cp "$f" "sbom-out/${crate}.cdx.json"; done
          tar -czf "harness2-workbench-${GITHUB_REF_NAME}-sbom.tar.gz" -C sbom-out .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: harness2-workbench-*.tar.gz
          retention-days: 7

  publish:
    name: draft release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the draft release and upload its assets
      id-token: write # OIDC token for signing the provenance attestation
      attestations: write # store the build-provenance attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: out
      - run: cd out && sha256sum harness2-workbench-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/harness2-workbench-*.tar.gz
      - name: Create the draft release (gh CLI, preinstalled on the runner)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag \
            --title "Harness² Workbench ${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md. Verify downloads with SHA256SUMS and \`gh attestation verify\`." \
            out/harness2-workbench-*.tar.gz out/SHA256SUMS
