# Harness² Studio configuration — annotated example (docs/ADMIN-GUIDE.md has the full reference).
# `h2studio init` writes a minimal one for you; `h2studio config check` validates any file.
# Unknown keys are errors, so a typo cannot silently fall back to a default.

[server]
# Loopback by default. Put a TLS reverse proxy in front to serve other machines.
listen = "127.0.0.1:8722"
# The URL people type. Sets the allowed Host header, the expected Origin, and Secure cookies
# when it is https.
public_url = "http://127.0.0.1:8722"
# Extra Host values to accept (e.g. a DNS name behind your proxy).
allowed_hosts = []
# Proxies whose X-Forwarded-For / X-Forwarded-Proto are trusted (CIDRs). Empty = none.
trusted_proxies = []
max_body_bytes = 1048576
request_timeout_secs = 60
sse_max_connections = 64
login_attempts_per_minute = 10

[auth]
# "token": API tokens; the web UI exchanges one for an HttpOnly session cookie.
# "proxy": a trusted SSO proxy (oauth2-proxy, Pomerium, ...) asserts the user; tokens still work.
mode = "token"
session_ttl_hours = 12

[auth.proxy]
user_header = "x-forwarded-user"
groups_header = "x-forwarded-groups"
# The proxy must also send this header with the shared secret from the environment variable.
secret_header = "x-h2s-proxy-secret"
secret_env = "H2S_PROXY_SECRET"
admin_groups = ["h2s-admins"]
operator_groups = ["h2s-operators"]
viewer_groups = []

[paths]
# Database, job logs, generated job files and split files. Created 0700.
data_dir = "~/.local/share/harness2-studio"
# Each experiment is one HARNESS2_RUNS_DIR under here. Default: <data_dir>/experiments
experiments_dir = ""
# The harness2 checkout. Default: <data_dir>/harness2 (installed by the Studio).
harness2_home = ""
# false = use an existing checkout you manage yourself; the Studio never modifies it.
harness2_managed = true

[jobs]
max_concurrent = 2
max_queued = 100
timeout_hours = 48
budget_poll_secs = 30
log_retention_days = 90

[isolation]
# "host": jobs run as this server's user, like harness2 itself (executors get your files and
#         network; every run must be acknowledged unless preacknowledge_host_risks = true).
# "container": each job runs in a hardened runner container (deploy/docker/runner.Dockerfile).
mode = "host"
preacknowledge_host_risks = false

[isolation.container]
runtime = "docker"
image = "harness2-studio-runner:0.1.0"
# "none" for no network (the demo works; model calls do not), or a network you created behind
# `h2studio egress-proxy` (see deploy/compose.yaml).
network = "none"
cpus = 4.0
memory_mb = 8192
pids_limit = 2048
user = ""

[egress]
# Used only by `h2studio egress-proxy`. Hostnames, exact or "*.suffix". Private, loopback,
# link-local and metadata addresses are always refused unless an entry allows them, e.g.
#   allow = ["aiplatform.googleapis.com", { host = "litellm", allow_private = true }]
listen = "0.0.0.0:3128"
allow = ["aiplatform.googleapis.com", "oauth2.googleapis.com"]

[telemetry]
log_format = "pretty"
log_level = "info"
# OTLP/HTTP collector, e.g. "http://127.0.0.1:4318". Empty = no trace export.
otlp_endpoint = ""
service_name = "harness2-studio"
# Name of a secret that Prometheus may present as a bearer token on /metrics.
metrics_token_secret = ""
