# Locked versions allowed despite being younger than the dependency cooldown
# (docs/SUPPLY-CHAIN.md). The only accepted reason is a security fix: a release that fixes a
# RustSec advisory always wins over the cooldown. Each entry expires once the release is old
# enough to pass on its own; `cargo xtask cooldown` reports stale entries.

