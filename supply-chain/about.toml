# cargo-about: the third-party licence texts shipped in release archives and the all-in-one image
# (THIRD-PARTY-LICENSES.md, written by `cargo xtask licenses`; docs/SUPPLY-CHAIN.md).

# The same allow-list as deny.toml [licenses].
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

# What is shipped: the Linux servers and the WebAssembly web UI they embed.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

# Only crates compiled into what is shipped; tests and build scripts are not.
ignore-dev-dependencies = true
ignore-build-dependencies = true

# The workspace's own crates (publish = false) are covered by LICENSE and NOTICE.
private = { ignore = true }
